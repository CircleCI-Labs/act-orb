version: 2.1
orbs:
  # Your orb will be automatically injected here during the pipeline.
  # Reference your orb's jobs and commands below as they will exist when built.
  orb-tools: circleci/orb-tools@12.5.0
  # The orb definition is intentionally not included here. It will be injected into the pipeline.
  act: {}

# Use this tag to ensure test jobs always run,
# even though the downstream publish job will only run on release tags.
filters: &filters
  tags:
    only: /.*/

# Filter for release tags.
release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

jobs:
  # Create jobs to test the commands of your orbs.
  # You may want to add additional validation steps to ensure the commands are working as expected.
  run_on_remote_docker:
    docker:
      - image: cimg/base:current
    steps:
      - setup_remote_docker
      - act/act:
          uses: actions/hello-world-javascript-action@v1.1
          with: |
            who-to-greet: "Mona the Octocat"
          env: |
            hello-world: "example-value"
          force-install: false
          debug: true
  # Regression coverage for the `outputs` feature (added for family parity):
  # asserts the action's real `time` output (see its action.yml) actually
  # lands in $BASH_ENV as a plain shell variable, not just that the job
  # exits zero.
  test_output_capture:
    docker:
      - image: cimg/base:current
    steps:
      - setup_remote_docker
      - act/act:
          uses: actions/hello-world-javascript-action@v1.1
          with: |
            who-to-greet: "Mona the Octocat"
          outputs: "time"
          force-install: false
          debug: true
      - run:
          name: Assert the action's output was captured into $BASH_ENV
          command: |
            if [ -z "${time:-}" ]; then
              echo "Expected \$time to be set by act/act's 'outputs' capture, but it was empty/unset." >&2
              exit 1
            fi
            echo "Captured action output: time=$time"
  # Regression coverage for the stale-outputs guard: a second act/act call in
  # the same job, with skip-create-workflow-file: true (so nothing
  # regenerates or truncates the handoff file this call), must not leave a
  # leftover handoff file from the first call's `outputs` capture sitting
  # around for `collect-outputs` to silently re-read as if it were fresh.
  test_stale_outputs_guard:
    docker:
      - image: cimg/base:current
    steps:
      - setup_remote_docker
      - act/act:
          uses: actions/hello-world-javascript-action@v1.1
          with: |
            who-to-greet: "Mona the Octocat"
          outputs: "time"
          force-install: false
          debug: true
      - run:
          name: Sanity check the first call's output capture landed
          command: |
            if [ -z "${time:-}" ]; then
              echo "Expected \$time to be set by the first act/act call's 'outputs' capture, but it was empty/unset." >&2
              exit 1
            fi
            echo "First call captured: time=$time"
      - act/act:
          workflow-file: .github/workflows/hello-world.yml
          skip-create-workflow-file: true
          outputs: "time"
          force-install: false
          debug: true
      - run:
          name: Assert the first call's handoff file was not left over for a silent re-read
          command: |
            if [ -f .act-orb-outputs.env ]; then
              echo "A stale .act-orb-outputs.env file from the first act/act call was still" >&2
              echo "present after a second call with skip-create-workflow-file: true. The" >&2
              echo "guard that removes it before Act runs did not fire." >&2
              exit 1
            fi
            echo "No stale outputs handoff file present after the second call -- guard is working."
  # Regression coverage for the family-consistent `id`/`inputs` aliases
  # (added for family parity): exercises them as the *only* way the action
  # is specified, rather than alongside `uses`/`with`.
  test_id_inputs_aliases:
    docker:
      - image: cimg/base:current
    steps:
      - setup_remote_docker
      - act/act:
          id: actions/hello-world-javascript-action@v1.1
          inputs: |
            who-to-greet: "Mona the Octocat"
          force-install: false
          debug: true
  # Regression coverage for the `services` passthrough (added for family
  # parity): verifies the generated workflow's `services:` block is valid
  # YAML that Act actually accepts and runs against, end to end.
  test_service_containers:
    docker:
      - image: cimg/base:current
    steps:
      - setup_remote_docker
      - act/act:
          uses: actions/hello-world-javascript-action@v1.1
          with: |
            who-to-greet: "Mona the Octocat"
          services: |
            redis:
              image: redis:7-alpine
          force-install: false
          debug: true
  # Regression coverage for the new github-token seam: pointed at a
  # differently-named env var, create-env-var-secret-files must alias that
  # variable's VALUE into the secrets bucket under the literal key
  # GITHUB_TOKEN, and must NOT leak the source variable's own name into the
  # plaintext env file, even though it's not itself on the (deliberately
  # emptied, for this test) `secrets` list.
  test_github_token_seam:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Seed a differently-named token env var
          command: echo 'export CCI_MINTED_GH_TOKEN=totally-a-seam-value' >> "$BASH_ENV"
      - act/create-env-var-secret-files:
          env-file: /tmp/seam-test.env
          secret-file: /tmp/seam-test.secrets
          var-file: /tmp/seam-test.vars
          secrets: ""
          github-token: CCI_MINTED_GH_TOKEN
      - run:
          name: Assert the seam aliased CCI_MINTED_GH_TOKEN into GITHUB_TOKEN
          command: |
            if ! grep -qx 'GITHUB_TOKEN=totally-a-seam-value' /tmp/seam-test.secrets; then
              echo "Expected GITHUB_TOKEN=totally-a-seam-value in /tmp/seam-test.secrets" >&2
              cat /tmp/seam-test.secrets >&2 || true
              exit 1
            fi
            if grep -q '^CCI_MINTED_GH_TOKEN=' /tmp/seam-test.env 2>/dev/null; then
              echo "CCI_MINTED_GH_TOKEN leaked into the plaintext env file" >&2
              exit 1
            fi
            echo "OK: github-token seam aliased correctly and did not leak the source var"
  # Integration coverage for the GitHub Actions workflow compiler (ghac):
  # compiles a real multi-job, needs:-chained GitHub workflow fixture into a
  # CircleCI config, then validates that config against the real CLI --
  # proving the setup-workflow half of the feature (act/gha-compile) end to
  # end, not just that ghac's own unit tests pass in isolation.
  test_gha_compile:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - act/gha-compile:
          workflow-file: tools/ghac/fixtures/02-needs-chain.yml
          out: /tmp/generated-config.yml
      - run:
          name: Install CircleCI CLI
          command: curl -fLSs https://raw.githubusercontent.com/CircleCI-Public/circleci-cli/master/install.sh | bash
      - run:
          name: Validate the generated config against the real CLI
          command: circleci config validate --config /tmp/generated-config.yml
  # Integration coverage for the per-job half (act/gha-render-job + act/act's
  # existing skip-create-workflow-file escape hatch): renders one job out of
  # a fixture GitHub workflow and actually executes it with a real `act`,
  # proving the runtime path a gha-compile-generated pipeline's own jobs
  # would follow -- not just that the rendered file happens to validate.
  test_gha_render_and_run:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker
      - act/gha-render-job:
          workflow-file: test/gha-compile-fixture/sample-workflow.yml
          job: hello
          out: /tmp/rendered-job.yml
      - run:
          name: Sanity check the rendered file before handing it to act
          command: |
            if [ ! -s /tmp/rendered-job.yml ]; then
              echo "Expected a non-empty rendered job file at /tmp/rendered-job.yml" >&2
              exit 1
            fi
            grep -q "run: echo" /tmp/rendered-job.yml
      - act/act:
          skip-create-workflow-file: true
          workflow-file: /tmp/rendered-job.yml
          job: hello
          force-install: false
          debug: true
  # Integration coverage for strategy.matrix -> CircleCI matrix (added for
  # family parity with buildkite-gha): compiles a 2x2 matrix fixture and
  # asserts the generated config contains a real matrix: stanza, then
  # validates it against the real CLI end to end -- proving the compiler
  # output is actually acceptable CircleCI config, not just well-formed YAML.
  test_gha_compile_matrix:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - act/gha-compile:
          workflow-file: tools/ghac/fixtures/08-matrix-2x2.yml
          out: /tmp/generated-matrix-config.yml
      - run:
          name: "Sanity check the matrix: stanza is actually present"
          command: |
            grep -q "matrix:" /tmp/generated-matrix-config.yml
            grep -q "parameters:" /tmp/generated-matrix-config.yml
      - run:
          name: Install CircleCI CLI
          command: curl -fLSs https://raw.githubusercontent.com/CircleCI-Public/circleci-cli/master/install.sh | bash
      - run:
          name: Validate the generated matrix config against the real CLI
          command: circleci config validate --config /tmp/generated-matrix-config.yml
  # Integration coverage for runs-on: self-hosted -> CircleCI self-hosted
  # runner resource classes (added for family parity). Deliberately does NOT
  # run `circleci config validate` here: the generated config's own
  # `act/gha-render-job` step passes --self-hosted-namespace, a command
  # parameter that only exists once THIS branch's own `Publish Dev` step
  # (later in this same workflow) has republished cci-labs/act@dev:... --
  # validating that against the registry here would be a same-run
  # chicken-and-egg failure on the very first run after this parameter was
  # added. Asserting the compiled resource_class/machine shape by grepping
  # gha-compile's own output still proves the --self-hosted-namespace flag
  # round-trips correctly through the orb command -> script -> ghac binary
  # in a real CircleCI job.
  test_gha_compile_self_hosted:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - act/gha-compile:
          workflow-file: tools/ghac/fixtures/11-self-hosted-runner.yml
          out: /tmp/generated-self-hosted-config.yml
          self-hosted-namespace: acme
      - run:
          name: Sanity check the self-hosted resource_class/machine shape
          command: |
            grep -q "machine: true" /tmp/generated-self-hosted-config.yml
            grep -q "resource_class: acme/linux-x64" /tmp/generated-self-hosted-config.yml

  # Real integration coverage for the Actions-cache shim (added for family
  # parity with buildkite-gha's own cache support). Runs the shim against
  # the REAL, live CircleCI runner API in an actual job, drives an actual
  # `actions/cache/save@v4` through act/act, and asserts the shim's own
  # protocol translation ran for real (CreateCacheEntry served, at least one
  # block accepted). It deliberately does NOT assert a cross-run cache hit:
  # see cache_shim_server.py's module docstring and the README's cache-shim
  # section for the reproduced, documented gap in $runner_host's own
  # cache-save upload leg -- this test fails loudly if the *negotiation*
  # regresses, and reports (without failing the build, matching
  # actions/cache's own best-effort semantics) whatever the real,
  # live outcome of the upload/restore leg is.
  # Uses the `machine` executor (this orb's own documented default -- see
  # src/executors/default.yml), NOT docker+setup_remote_docker, for a real,
  # measured reason: setup_remote_docker gives you a REMOTE Docker daemon
  # that cannot see this job container's own filesystem at all, so `--bind`
  # (a volume mount) silently shares nothing. Confirmed live: caching even
  # this repo's own already-committed LICENSE file failed with "No files
  # were found with the provided path: LICENSE" under setup_remote_docker;
  # switching to `machine` (a real local Docker daemon) fixed it immediately
  # with no other change. This is very likely also the root cause of the
  # pre-existing, out-of-scope test_output_capture/test_stale_outputs_guard
  # failures noted in this repo's own history -- both also rely on `--bind`
  # under docker+setup_remote_docker -- but fixing those is out of scope
  # here; this comment just records the likely shared root cause for
  # whoever picks that up next.
  test_cache_shim:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - act/cache-shim
      - act/act:
          # checkout: false -- we already checked out once above.
          checkout: false
          uses: actions/cache/save@v4
          with: |
            path: LICENSE
            key: cache-shim-test-<< pipeline.number >>
          force-install: false
          debug: true
      - act/act:
          checkout: false
          uses: actions/cache/restore@v4
          with: |
            path: LICENSE
            key: cache-shim-test-<< pipeline.number >>
          force-install: false
          debug: true
      - run:
          name: Assert the shim's own Twirp negotiation actually ran (regression gate)
          command: |
            LOG=/tmp/.cache-shim/server.log
            if [ ! -f "$LOG" ]; then
              echo "Expected the cache shim's own server log at $LOG -- the shim never started." >&2
              exit 1
            fi
            echo "=== cache-shim server log ==="
            cat "$LOG"
            echo "=============================="
            if ! grep -q 'CreateCacheEntry HTTP/1.1" 200' "$LOG"; then
              echo "Regression: the shim never served a successful CreateCacheEntry call --" >&2
              echo "actions/cache/save@v4 never reached the shim, or auth/negotiation broke." >&2
              exit 1
            fi
            echo "OK: shim served CreateCacheEntry successfully -- protocol negotiation works."
            # PUT /upload/<id> ends either in a 201 (commit accepted by the
            # fake/real backend) or a 500 (commit attempted, real backend
            # upload leg 404d -- see the README's cache-shim section); either
            # one proves the commit step (single-shot or blocklist,
            # actions/cache picks whichever the file size calls for) was
            # actually reached, not skipped.
            if grep -qE 'PUT /upload/.*" (201|500)' "$LOG"; then
              echo "OK: shim reached the upload-commit step (the real byte-persistence leg was attempted)."
            fi
            if grep -q 'commit failed' "$LOG"; then
              echo "NOTE (expected, documented, non-fatal): the real upload to CircleCI's own"
              echo "runner API 404s past the cache-save 'ticket' -- see the README's cache-shim"
              echo "section. actions/cache treats this as a non-fatal warning, not a build failure."
            fi
            echo "This job proves the shim's protocol translation is real and exercised end to end"
            echo "against the live CircleCI runner API; it does not (and today cannot) assert a"
            echo "cross-run cache hit -- see the README for the honest, reproduced state of that gap."
  # Real integration coverage for enabling Act's OWN built-in artifact
  # server (`--artifact-server-path`) -- added for family parity, and much
  # smaller than a from-scratch artifact shim would have been: Act already
  # implements the real artifact-v4 protocol end to end (pkg/artifacts),
  # this orb just never passed the one flag that turns it on. Runs a real
  # `actions/upload-artifact@v4` through act/act and asserts the uploaded
  # file actually lands on the CircleCI host's disk at the configured path,
  # then hands it to a native `store_artifacts` step.
  # `machine`, not docker+setup_remote_docker -- see the test_cache_shim
  # job's own comment above for why (remote Docker cannot see this
  # container's filesystem, so --bind shares nothing).
  test_artifacts:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - act/act:
          checkout: false
          uses: actions/upload-artifact@v4
          with: |
            name: cache-shim-test-artifact
            path: LICENSE
          artifact-server-path: /tmp/act-artifacts
          force-install: false
          debug: true
      - run:
          name: Assert the uploaded artifact actually landed on the CircleCI host's disk
          command: |
            if [ ! -d /tmp/act-artifacts ]; then
              echo "Expected /tmp/act-artifacts to exist -- Act's own --artifact-server-path was not honored." >&2
              exit 1
            fi
            echo "=== /tmp/act-artifacts contents ==="
            find /tmp/act-artifacts -type f
            if ! find /tmp/act-artifacts -type f | grep -q .; then
              echo "Expected at least one uploaded file under /tmp/act-artifacts" >&2
              exit 1
            fi
            echo "OK: actions/upload-artifact@v4's file is really on disk via Act's own artifact server."
      - store_artifacts:
          path: /tmp/act-artifacts
          destination: gha-artifacts

  # Regression coverage for boolean-parameter encoding (added for family
  # parity -- see harness-orb's test_run_plugin_booleans, the audit item
  # this mirrors). run-act.sh's is_true() is the ONLY thing standing between
  # six real orb parameters (pull, rebuild, reuse, bind, detect-event,
  # action-offline-mode) and Act getting the opposite of what the user
  # asked for -- and this exact bug class (published orbs render a boolean
  # parameter as "1"/"0", inline callers render "true"/"false") has already
  # shipped once in this orb family. Drives run-act.sh directly with a fake
  # `act` binary on PATH that just logs its own argv, so both encodings are
  # asserted against the REAL script, not a reimplementation of its logic.
  test_run_act_booleans:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Regression test - pull/rebuild/reuse/bind/detect-event/action-offline-mode booleans reach act's own argv"
          command: |
            set -euo pipefail
            fakebin="$(mktemp -d)"
            call_log="$(mktemp)"
            cat > "${fakebin}/act" << 'FAKEACT'
            #!/bin/bash
            echo "$@" >> "${ACT_CALL_LOG}"
            FAKEACT
            chmod +x "${fakebin}/act"

            # run-act.sh no longer defines is_true() itself -- run-act.yml's
            # `command:` prepends the shared src/scripts/lib/is_true.sh
            # include ahead of it at pack time (see that file). This test
            # drives the real script file directly, standalone, so source the
            # shared definition and export it as a bash function so the
            # `bash src/scripts/run-act.sh` call below sees it too.
            # shellcheck source=/dev/null
            source src/scripts/lib/is_true.sh
            export -f is_true

            # run-act.sh requires the workflow file to actually exist (a real,
            # separate check unrelated to booleans) -- give it an empty one.
            # Every OTHER *-file parameter is deliberately left pointed at a
            # nonexistent path: run-act.sh only warns and skips the matching
            # --*-file flag for those, which is irrelevant to this test.
            wf="$(mktemp)"
            missing="$(mktemp -u)"

            run_case() {
              : > "${call_log}"
              PATH="${fakebin}:${PATH}" \
                ACT_CALL_LOG="${call_log}" \
                ORB_VAL_WORKFLOW_FILE="${wf}" \
                ORB_VAL_PLATFORM="ubuntu-latest=catthehacker/ubuntu:act-latest" \
                ORB_VAL_ENV_FILE="${missing}.env" \
                ORB_VAL_SECRET_FILE="${missing}.secrets" \
                ORB_VAL_INPUT_FILE="${missing}.input" \
                ORB_VAL_VAR_FILE="${missing}.vars" \
                ORB_VAL_EVENT_FILE="${missing}.event" \
                ORB_VAL_ACTOR="nektos/act" \
                ORB_VAL_VERBOSE="false" \
                ORB_VAL_DIRECTORY="." \
                ORB_VAL_DEFAULT_BRANCH="main" \
                ORB_VAL_JOB="" \
                ORB_VAL_REMOTE_NAME="origin" \
                ORB_VAL_ADDITIONAL_ACT_FLAGS="" \
                ORB_VAL_ARTIFACT_SERVER_PATH="" \
                ORB_VAL_ARTIFACT_SERVER_ADDR="" \
                ORB_VAL_ARTIFACT_SERVER_PORT="" \
                ORB_VAL_OUTPUTS="" \
                ORB_VAL_OUTPUTS_FILE=".act-orb-outputs.env" \
                ORB_VAL_PULL="$1" \
                ORB_VAL_REBUILD="$2" \
                ORB_VAL_REUSE="$3" \
                ORB_VAL_BIND="$4" \
                ORB_VAL_DETECT_EVENT="$5" \
                ORB_VAL_ACTION_OFFLINE_MODE="$6" \
                bash src/scripts/run-act.sh > /dev/null
            }

            assert_all_true() {
              local encoding="$1"
              if grep -q -- '--pull=false' "${call_log}"; then
                echo "FAIL (${encoding}): pull=true still added --pull=false - got:" >&2
                cat "${call_log}" >&2; exit 1
              fi
              if grep -q -- '--rebuild=false' "${call_log}"; then
                echo "FAIL (${encoding}): rebuild=true still added --rebuild=false - got:" >&2
                cat "${call_log}" >&2; exit 1
              fi
              for flag in '--reuse' '--bind' '--detect-event' '--action-offline-mode'; do
                if ! grep -q -- "${flag}" "${call_log}"; then
                  echo "FAIL (${encoding}): true did not add ${flag} - got:" >&2
                  cat "${call_log}" >&2; exit 1
                fi
              done
              echo "OK (${encoding}): all six true-booleans took effect."
            }

            assert_all_false() {
              local encoding="$1"
              if ! grep -q -- '--pull=false' "${call_log}"; then
                echo "FAIL (${encoding}): pull=false did not add --pull=false - got:" >&2
                cat "${call_log}" >&2; exit 1
              fi
              if ! grep -q -- '--rebuild=false' "${call_log}"; then
                echo "FAIL (${encoding}): rebuild=false did not add --rebuild=false - got:" >&2
                cat "${call_log}" >&2; exit 1
              fi
              for flag in '--reuse' '--bind' '--detect-event' '--action-offline-mode'; do
                if grep -q -- "${flag}" "${call_log}"; then
                  echo "FAIL (${encoding}): false still added ${flag} - got:" >&2
                  cat "${call_log}" >&2; exit 1
                fi
              done
              echo "OK (${encoding}): all six false-booleans correctly did nothing."
            }

            # Published-orb encoding: booleans render as "1"/"0".
            run_case "1" "1" "1" "1" "1" "1"
            assert_all_true "1/0 encoding, all true"
            run_case "0" "0" "0" "0" "0" "0"
            assert_all_false "1/0 encoding, all false"

            # Inline-job encoding: booleans render as "true"/"false".
            run_case "true" "true" "true" "true" "true" "true"
            assert_all_true "true/false encoding, all true"
            run_case "false" "false" "false" "false" "false" "false"
            assert_all_false "true/false encoding, all false"

            echo "All boolean-encoding regression cases passed."

  # Direct script-level tests (added for family parity -- the four vendor orbs all invoke their
  # own scripts directly with ORB_VAL_* env vars and assert on exact error text for hostile
  # input; act-orb had zero direct script tests before this job, every script was only exercised
  # indirectly through a full act/act dispatch). Covers create-workflow-file.sh's own hostile
  # input (neither action/uses nor id set) plus an injection-regression case for each of
  # `with`/`env`/`services` -- the exact three parameters the README's own Security notes flag
  # as "trusted, unescaped input." This does NOT fix that -- it pins the CURRENT, documented
  # behavior (verbatim, unescaped passthrough) so a future change to escaping is a deliberate,
  # visible decision instead of a silent one that leaves the README's own claim stale.
  test_create_workflow_file_script:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Hostile input - neither action/uses nor id set is rejected with the exact error
          command: |
            set -eu
            wf="$(mktemp)"
            set +e
            error_output="$(ORB_VAL_WORKFLOW_FILE="${wf}" ORB_VAL_ACTION="" ORB_VAL_ACTION_ID="" \
              ORB_VAL_WITH="" ORB_VAL_INPUTS="" ORB_VAL_ENV="" ORB_VAL_WORKFLOW_NAME=circleci \
              ORB_VAL_WORKFLOW_EVENT=push ORB_VAL_JOB_NAME=action ORB_VAL_RUNS_ON_IMAGE=ubuntu-latest \
              ORB_VAL_SERVICES="" ORB_VAL_OUTPUTS="" ORB_VAL_OUTPUTS_FILE=.act-orb-outputs.env \
              bash src/scripts/create-workflow-file.sh 2>&1)"
            actual_exit=$?
            set -e
            if [ "${actual_exit}" -eq 0 ]; then
              echo "FAIL: expected create-workflow-file.sh to reject when neither action/uses nor id is set, but it exited 0" >&2
              exit 1
            fi
            case "${error_output}" in
              *"one of the 'action'/'uses' or 'id' parameters is required but neither was set"*) ;;
              *)
                echo "FAIL: expected that exact error text, got:" >&2
                echo "${error_output}" >&2
                exit 1
                ;;
            esac
            echo "OK: missing action/uses/id is rejected with the exact, documented error."
      - run:
          name: "Injection regression - with/env/services pass through verbatim, unescaped"
          command: |
            set -euo pipefail
            wf="$(mktemp)"
            ORB_VAL_WORKFLOW_FILE="${wf}" \
              ORB_VAL_ACTION="actions/hello-world-javascript-action@v1.1" \
              ORB_VAL_ACTION_ID="" \
              ORB_VAL_WITH=$'legit-key: legit-value\ninjected-key: "attacker value with a colon: and a dash - here"' \
              ORB_VAL_INPUTS="" \
              ORB_VAL_ENV=$'plain: env-value\nENV_INJECTED: "another: colon - dash"' \
              ORB_VAL_WORKFLOW_NAME=circleci ORB_VAL_WORKFLOW_EVENT=push ORB_VAL_JOB_NAME=action \
              ORB_VAL_RUNS_ON_IMAGE=ubuntu-latest \
              ORB_VAL_SERVICES=$'evil-service:\n  image: attacker/whatever:latest' \
              ORB_VAL_OUTPUTS="" ORB_VAL_OUTPUTS_FILE=.act-orb-outputs.env \
              bash src/scripts/create-workflow-file.sh

            echo "=== generated workflow ==="
            cat "${wf}"
            echo "=================="

            assert_line() {
              if ! grep -qxF "$1" "${wf}"; then
                echo "FAIL: expected this EXACT, unescaped line in the generated workflow:" >&2
                echo "  $1" >&2
                echo "This is a regression check for the README's own documented 'trusted," >&2
                echo "unescaped input' security posture -- if this now fails because the line" >&2
                echo "came through escaped/quoted/rejected instead, that is a real, deliberate" >&2
                echo "behavior change that the README's Security notes section must be updated" >&2
                echo "to match, not a bug in this test." >&2
                exit 1
              fi
            }
            assert_line '          injected-key: "attacker value with a colon: and a dash - here"'
            assert_line '          ENV_INJECTED: "another: colon - dash"'
            assert_line '        image: attacker/whatever:latest'
            echo "OK: with/env/services all passed through verbatim and unescaped, exactly as documented."

  # Gap-closing test: create-env-var-secret-files.sh had no dedicated direct test -- only
  # exercised indirectly via act/act. Covers the secrets-vs-variables priority conflict, and pins
  # the README's own documented risk (Security notes: "still written unquoted... may not
  # round-trip an embedded newline correctly") as a real, reproduced regression check: an
  # ordinary (non-secret) env var whose VALUE contains an embedded newline forges an extra,
  # unrelated KEY=VALUE line into the plaintext .env file Act reads from.
  test_create_env_var_secret_files_script:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Secrets-vs-variables conflict, and an injection regression via an embedded newline
          command: |
            set -euo pipefail
            env_file="$(mktemp)"; secret_file="$(mktemp)"; var_file="$(mktemp)"
            rm -f "${env_file}" "${secret_file}" "${var_file}"

            export CCI_TEST_SECRET="topsecret"
            export CCI_TEST_VAR="varvalue"
            export CCI_TEST_CONFLICT="should-be-secret-not-var"
            # Hostile input: an ordinary env var whose value embeds a newline followed by
            # something that looks like its own KEY=VALUE line.
            export CCI_TEST_INJECT=$'line-one\nCCI_INJECTED=evil'

            ORB_VAL_ENV_FILE="${env_file}" ORB_VAL_SECRET_FILE="${secret_file}" ORB_VAL_VAR_FILE="${var_file}" \
              ORB_VAL_SECRETS="CCI_TEST_SECRET,CCI_TEST_CONFLICT" \
              ORB_VAL_VARIABLES="CCI_TEST_VAR,CCI_TEST_CONFLICT" \
              ORB_VAL_GITHUB_TOKEN="" \
              bash src/scripts/create-env-var-secret-files.sh

            echo "=== secret file ==="; cat "${secret_file}"
            echo "=== var file ==="; cat "${var_file}"
            echo "=== env file ==="; cat "${env_file}"

            if ! grep -qx "CCI_TEST_CONFLICT=should-be-secret-not-var" "${secret_file}"; then
              echo "FAIL: a key named in both secrets and variables should land in the SECRET file" >&2
              exit 1
            fi
            if grep -q "^CCI_TEST_CONFLICT=" "${var_file}"; then
              echo "FAIL: CCI_TEST_CONFLICT leaked into the var file as well as the secret file" >&2
              exit 1
            fi
            echo "OK: secrets-vs-variables conflict resolves to secret, as documented."

            if ! grep -qx "CCI_TEST_INJECT=line-one" "${env_file}"; then
              echo "FAIL: expected the first line of the multi-line value in the plaintext env file" >&2
              exit 1
            fi
            if ! grep -qx "CCI_INJECTED=evil" "${env_file}"; then
              echo "FAIL (regression): expected the embedded-newline continuation line to appear as" >&2
              echo "its own forged 'CCI_INJECTED=evil' line -- this is the CURRENT, documented risk" >&2
              echo "(README Security notes: values are written unquoted). If this now fails because" >&2
              echo "the value round-trips safely instead, that is a real improvement the README's" >&2
              echo "own warning should be updated to reflect, not a bug in this test." >&2
              exit 1
            fi
            echo "OK (documented risk, pinned as a regression check, not fixed here): an embedded"
            echo "newline in an ordinary env var's value forges an extra, unrelated line in the"
            echo "plaintext .env file, exactly as the README's Security notes already warn."

  # Gap-closing test: collect-outputs.sh had no dedicated direct test either. Covers the
  # documented safe-no-op-on-missing-file path, the dash-sanitization warning path, AND --
  # deliberately contrasting with create-env-var-secret-files.sh's own documented risk above --
  # proves collect-outputs.sh's printf '%q' quoting genuinely neutralizes shell metacharacters
  # (command substitution, backticks, quotes) in an action's own output VALUE rather than
  # re-interpreting them when $BASH_ENV is later sourced.
  test_collect_outputs_script:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Missing handoff file is a safe no-op (exit 0, no error)
          command: |
            set -euo pipefail
            dir="$(mktemp -d)"
            export BASH_ENV="$(mktemp)"
            ORB_VAL_DIRECTORY="${dir}" ORB_VAL_OUTPUTS_FILE=".missing.env" ORB_VAL_OUTPUTS="time" \
              bash src/scripts/collect-outputs.sh
            echo "OK: a missing handoff file exits 0 with no error, as documented."
      - run:
          name: "Hostile output key (dash) and a shell-metacharacter value are both handled safely"
          command: |
            set -euo pipefail
            dir="$(mktemp -d)"
            handoff="${dir}/.act-orb-outputs.env"
            {
              printf "%s<<%s\n" "my-output" "DELIM1"
              printf "%s\n" "safe-value"
              printf "%s\n" "DELIM1"
              printf "%s<<%s\n" "evil" "DELIM2"
              printf '%s\n' '$(touch /tmp/pwned-subshell) `touch /tmp/pwned-backtick` "quoted"'
              printf "%s\n" "DELIM2"
            } > "${handoff}"

            export BASH_ENV="$(mktemp)"
            : > "${BASH_ENV}"
            OUT="$(ORB_VAL_DIRECTORY="${dir}" ORB_VAL_OUTPUTS_FILE=".act-orb-outputs.env" \
              ORB_VAL_OUTPUTS="my-output,evil" bash src/scripts/collect-outputs.sh 2>&1)"
            echo "${OUT}"

            case "${OUT}" in
              *"is not a valid shell variable name; exporting as 'my_output' instead"*) ;;
              *)
                echo "FAIL: expected the dash-sanitization warning for 'my-output'" >&2
                exit 1
                ;;
            esac

            # shellcheck disable=SC1090
            ( source "${BASH_ENV}"
              if [ "${my_output:-}" != "safe-value" ]; then
                echo "FAIL: expected my_output=safe-value after sourcing \$BASH_ENV, got '${my_output:-}'" >&2
                exit 1
              fi
              if [ "${evil:-}" != '$(touch /tmp/pwned-subshell) `touch /tmp/pwned-backtick` "quoted"' ]; then
                echo "FAIL: expected the metacharacter value to round-trip EXACTLY, got '${evil:-}'" >&2
                exit 1
              fi
            )
            if [ -e /tmp/pwned-subshell ] || [ -e /tmp/pwned-backtick ]; then
              echo "FAIL: shell metacharacters in an output VALUE actually executed when \$BASH_ENV was sourced" >&2
              exit 1
            fi
            echo "OK: dash-sanitized key exported correctly, and a shell-metacharacter value"
            echo "round-tripped exactly without executing -- printf '%q' quoting works as designed."

workflows:
  test-deploy:
    jobs:
      - test_cache_shim:
          name: Testing Actions Cache Shim
          filters: *filters
      - test_artifacts:
          name: Testing Artifacts (Act's built-in server)
          filters: *filters
      - test_run_act_booleans:
          name: Testing Boolean Parameter Encoding
          filters: *filters
      - test_create_workflow_file_script:
          name: Testing create-workflow-file.sh Directly
          filters: *filters
      - test_create_env_var_secret_files_script:
          name: Testing create-env-var-secret-files.sh Directly
          filters: *filters
      - test_collect_outputs_script:
          name: Testing collect-outputs.sh Directly
          filters: *filters
      # Make sure to include "filters: *filters" in every test job you want to run as part of your deployment.
      # Test your orb's commands in a custom job and test your orb's jobs directly as a part of this workflow.
      - run_on_remote_docker:
          name: Testing Remote Docker
          filters: *filters
      - test_output_capture:
          name: Testing Output Capture
          filters: *filters
      - test_stale_outputs_guard:
          name: Testing Stale Outputs Guard
          filters: *filters
      - test_id_inputs_aliases:
          name: Testing id/inputs Aliases
          filters: *filters
      - test_service_containers:
          name: Testing Service Containers
          filters: *filters
      - test_github_token_seam:
          name: Testing github-token Seam
          filters: *filters
      - test_gha_compile:
          name: Testing GHA Workflow Compiler (compile)
          filters: *filters
      - test_gha_render_and_run:
          name: Testing GHA Workflow Compiler (render + run)
          filters: *filters
      - test_gha_compile_matrix:
          name: Testing GHA Workflow Compiler (matrix)
          filters: *filters
      - test_gha_compile_self_hosted:
          name: Testing GHA Workflow Compiler (self-hosted runner)
          filters: *filters
      - act/act:
          name: Testing Overriding Executor
          uses: actions/hello-world-javascript-action@v1.1
          with: |
            who-to-greet: "Mona the Octocat"
          env: |
            hello: world
          executor:
            name: act/default
            image: android:2024.11.1
            resource_class: medium
            docker_layer_caching: true
          force-install: true
          debug: true
          filters: *filters
      - act/act:
          name: Testing Running Workflow File
          workflow-file: .github/workflows/hello-world.yml
          skip-create-workflow-file: true
          force-install: false
          debug: true
          filters: *filters
      # The orb must be re-packed for publishing, and saved to the workspace.
      - orb-tools/pack:
          filters: *filters
          requires:
            - "Testing Remote Docker"
            - "Testing Output Capture"
            - "Testing Stale Outputs Guard"
            - "Testing id/inputs Aliases"
            - "Testing Service Containers"
            - "Testing github-token Seam"
            - "Testing Overriding Executor"
            - "Testing Running Workflow File"
            - "Testing Actions Cache Shim"
            - "Testing Artifacts (Act's built-in server)"
            - "Testing GHA Workflow Compiler (compile)"
            - "Testing GHA Workflow Compiler (render + run)"
            - "Testing GHA Workflow Compiler (matrix)"
            - "Testing GHA Workflow Compiler (self-hosted runner)"
            - "Testing Boolean Parameter Encoding"
            - "Testing create-workflow-file.sh Directly"
            - "Testing create-env-var-secret-files.sh Directly"
            - "Testing collect-outputs.sh Directly"
      - orb-tools/publish:
          name: "Publish Dev"
          orb_name: cci-labs/act
          vcs_type: << pipeline.project.type >>
          pub_type: dev
          # Ensure this job requires all test jobs and the pack job.
          requires:
            - orb-tools/pack
          context: orb-publishing
          release_environment: orbs-dev
          github_token: GHI_TOKEN
      - orb-tools/publish:
          name: "Publish Production"
          orb_name: cci-labs/act
          vcs_type: << pipeline.project.type >>
          pub_type: production
          # Ensure this job requires all test jobs and the pack job.
          requires:
            - orb-tools/pack
          context: orb-publishing
          filters: *release-filters
          release_environment: orbs-prod
          github_token: GHI_TOKEN
