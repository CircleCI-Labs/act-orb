version: 2.1
orbs:
  # Your orb will be automatically injected here during the pipeline.
  # Reference your orb's jobs and commands below as they will exist when built.
  orb-tools: circleci/orb-tools@12.5.0
  # The orb definition is intentionally not included here. It will be injected into the pipeline.
  act: {}

# Use this tag to ensure test jobs always run,
# even though the downstream publish job will only run on release tags.
filters: &filters
  tags:
    only: /.*/

# Filter for release tags.
release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

jobs:
  # Create jobs to test the commands of your orbs.
  # You may want to add additional validation steps to ensure the commands are working as expected.
  run_on_remote_docker:
    docker:
      - image: cimg/base:current
    steps:
      - setup_remote_docker
      - act/act:
          uses: actions/hello-world-javascript-action@v1.1
          with: |
            who-to-greet: "Mona the Octocat"
          env: |
            hello-world: "example-value"
          force-install: false
          debug: true
  # Regression coverage for the `outputs` feature (added for family parity):
  # asserts the action's real `time` output (see its action.yml) actually
  # lands in $BASH_ENV as a plain shell variable, not just that the job
  # exits zero.
  test_output_capture:
    docker:
      - image: cimg/base:current
    steps:
      - setup_remote_docker
      - act/act:
          uses: actions/hello-world-javascript-action@v1.1
          with: |
            who-to-greet: "Mona the Octocat"
          outputs: "time"
          force-install: false
          debug: true
      - run:
          name: Assert the action's output was captured into $BASH_ENV
          command: |
            if [ -z "${time:-}" ]; then
              echo "Expected \$time to be set by act/act's 'outputs' capture, but it was empty/unset." >&2
              exit 1
            fi
            echo "Captured action output: time=$time"
  # Regression coverage for the stale-outputs guard: a second act/act call in
  # the same job, with skip-create-workflow-file: true (so nothing
  # regenerates or truncates the handoff file this call), must not leave a
  # leftover handoff file from the first call's `outputs` capture sitting
  # around for `collect-outputs` to silently re-read as if it were fresh.
  test_stale_outputs_guard:
    docker:
      - image: cimg/base:current
    steps:
      - setup_remote_docker
      - act/act:
          uses: actions/hello-world-javascript-action@v1.1
          with: |
            who-to-greet: "Mona the Octocat"
          outputs: "time"
          force-install: false
          debug: true
      - run:
          name: Sanity check the first call's output capture landed
          command: |
            if [ -z "${time:-}" ]; then
              echo "Expected \$time to be set by the first act/act call's 'outputs' capture, but it was empty/unset." >&2
              exit 1
            fi
            echo "First call captured: time=$time"
      - act/act:
          workflow-file: .github/workflows/hello-world.yml
          skip-create-workflow-file: true
          outputs: "time"
          force-install: false
          debug: true
      - run:
          name: Assert the first call's handoff file was not left over for a silent re-read
          command: |
            if [ -f .act-orb-outputs.env ]; then
              echo "A stale .act-orb-outputs.env file from the first act/act call was still" >&2
              echo "present after a second call with skip-create-workflow-file: true. The" >&2
              echo "guard that removes it before Act runs did not fire." >&2
              exit 1
            fi
            echo "No stale outputs handoff file present after the second call -- guard is working."
  # Regression coverage for the family-consistent `id`/`inputs` aliases
  # (added for family parity): exercises them as the *only* way the action
  # is specified, rather than alongside `uses`/`with`.
  test_id_inputs_aliases:
    docker:
      - image: cimg/base:current
    steps:
      - setup_remote_docker
      - act/act:
          id: actions/hello-world-javascript-action@v1.1
          inputs: |
            who-to-greet: "Mona the Octocat"
          force-install: false
          debug: true
  # Regression coverage for the `services` passthrough (added for family
  # parity): verifies the generated workflow's `services:` block is valid
  # YAML that Act actually accepts and runs against, end to end.
  test_service_containers:
    docker:
      - image: cimg/base:current
    steps:
      - setup_remote_docker
      - act/act:
          uses: actions/hello-world-javascript-action@v1.1
          with: |
            who-to-greet: "Mona the Octocat"
          services: |
            redis:
              image: redis:7-alpine
          force-install: false
          debug: true
  # Regression coverage for the new github-token seam: pointed at a
  # differently-named env var, create-env-var-secret-files must alias that
  # variable's VALUE into the secrets bucket under the literal key
  # GITHUB_TOKEN, and must NOT leak the source variable's own name into the
  # plaintext env file, even though it's not itself on the (deliberately
  # emptied, for this test) `secrets` list.
  test_github_token_seam:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Seed a differently-named token env var
          command: echo 'export CCI_MINTED_GH_TOKEN=totally-a-seam-value' >> "$BASH_ENV"
      - act/create-env-var-secret-files:
          env-file: /tmp/seam-test.env
          secret-file: /tmp/seam-test.secrets
          var-file: /tmp/seam-test.vars
          secrets: ""
          github-token: CCI_MINTED_GH_TOKEN
      - run:
          name: Assert the seam aliased CCI_MINTED_GH_TOKEN into GITHUB_TOKEN
          command: |
            if ! grep -qx 'GITHUB_TOKEN=totally-a-seam-value' /tmp/seam-test.secrets; then
              echo "Expected GITHUB_TOKEN=totally-a-seam-value in /tmp/seam-test.secrets" >&2
              cat /tmp/seam-test.secrets >&2 || true
              exit 1
            fi
            if grep -q '^CCI_MINTED_GH_TOKEN=' /tmp/seam-test.env 2>/dev/null; then
              echo "CCI_MINTED_GH_TOKEN leaked into the plaintext env file" >&2
              exit 1
            fi
            echo "OK: github-token seam aliased correctly and did not leak the source var"
  # Integration coverage for the GitHub Actions workflow compiler (ghac):
  # compiles a real multi-job, needs:-chained GitHub workflow fixture into a
  # CircleCI config, then validates that config against the real CLI --
  # proving the setup-workflow half of the feature (act/gha-compile) end to
  # end, not just that ghac's own unit tests pass in isolation.
  test_gha_compile:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - act/gha-compile:
          workflow-file: tools/ghac/fixtures/02-needs-chain.yml
          out: /tmp/generated-config.yml
      - run:
          name: Install CircleCI CLI
          command: curl -fLSs https://raw.githubusercontent.com/CircleCI-Public/circleci-cli/master/install.sh | bash
      - run:
          name: Validate the generated config against the real CLI
          command: circleci config validate --config /tmp/generated-config.yml
  # Integration coverage for the per-job half (act/gha-render-job + act/act's
  # existing skip-create-workflow-file escape hatch): renders one job out of
  # a fixture GitHub workflow and actually executes it with a real `act`,
  # proving the runtime path a gha-compile-generated pipeline's own jobs
  # would follow -- not just that the rendered file happens to validate.
  test_gha_render_and_run:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker
      - act/gha-render-job:
          workflow-file: test/gha-compile-fixture/sample-workflow.yml
          job: hello
          out: /tmp/rendered-job.yml
      - run:
          name: Sanity check the rendered file before handing it to act
          command: |
            if [ ! -s /tmp/rendered-job.yml ]; then
              echo "Expected a non-empty rendered job file at /tmp/rendered-job.yml" >&2
              exit 1
            fi
            grep -q "run: echo" /tmp/rendered-job.yml
      - act/act:
          skip-create-workflow-file: true
          workflow-file: /tmp/rendered-job.yml
          job: hello
          force-install: false
          debug: true

workflows:
  test-deploy:
    jobs:
      # Make sure to include "filters: *filters" in every test job you want to run as part of your deployment.
      # Test your orb's commands in a custom job and test your orb's jobs directly as a part of this workflow.
      - run_on_remote_docker:
          name: Testing Remote Docker
          filters: *filters
      - test_output_capture:
          name: Testing Output Capture
          filters: *filters
      - test_stale_outputs_guard:
          name: Testing Stale Outputs Guard
          filters: *filters
      - test_id_inputs_aliases:
          name: Testing id/inputs Aliases
          filters: *filters
      - test_service_containers:
          name: Testing Service Containers
          filters: *filters
      - test_github_token_seam:
          name: Testing github-token Seam
          filters: *filters
      - test_gha_compile:
          name: Testing GHA Workflow Compiler (compile)
          filters: *filters
      - test_gha_render_and_run:
          name: Testing GHA Workflow Compiler (render + run)
          filters: *filters
      - act/act:
          name: Testing Overriding Executor
          uses: actions/hello-world-javascript-action@v1.1
          with: |
            who-to-greet: "Mona the Octocat"
          env: |
            hello: world
          executor:
            name: act/default
            image: android:2024.11.1
            resource_class: medium
            docker_layer_caching: true
          force-install: true
          debug: true
          filters: *filters
      - act/act:
          name: Testing Running Workflow File
          workflow-file: .github/workflows/hello-world.yml
          skip-create-workflow-file: true
          force-install: false
          debug: true
          filters: *filters
      # The orb must be re-packed for publishing, and saved to the workspace.
      - orb-tools/pack:
          filters: *filters
          requires:
            - "Testing Remote Docker"
            - "Testing Output Capture"
            - "Testing Stale Outputs Guard"
            - "Testing id/inputs Aliases"
            - "Testing Service Containers"
            - "Testing github-token Seam"
            - "Testing Overriding Executor"
            - "Testing Running Workflow File"
      - orb-tools/publish:
          name: "Publish Dev"
          orb_name: cci-labs/act
          vcs_type: << pipeline.project.type >>
          pub_type: dev
          # Ensure this job requires all test jobs and the pack job.
          requires:
            - orb-tools/pack
          context: orb-publishing
          release_environment: orbs-dev
          github_token: GHI_TOKEN
      - orb-tools/publish:
          name: "Publish Production"
          orb_name: cci-labs/act
          vcs_type: << pipeline.project.type >>
          pub_type: production
          # Ensure this job requires all test jobs and the pack job.
          requires:
            - orb-tools/pack
          context: orb-publishing
          filters: *release-filters
          release_environment: orbs-prod
          github_token: GHI_TOKEN
