version: 2.1
setup: true
orbs:
  orb-tools: circleci/orb-tools@12.5.0
  shellcheck: circleci/shellcheck@3.4.0

filters: &filters
  tags:
    only: /.*/

jobs:
  check-cli-version:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Install CircleCI CLI
          command: curl -fLSs https://raw.githubusercontent.com/CircleCI-Public/circleci-cli/master/install.sh | bash
      - run:
          name: Check CircleCI CLI version floor (>= 1.0.48254)
          command: bash scripts/check-circleci-cli-version.sh
  shfmt-check:
    # Pinned to an exact tag of the maintainer's own published image -- no
    # credentials required, matches this repo's "pin everything" posture.
    docker:
      - image: mvdan/shfmt:v3.13.1-alpine
    steps:
      - checkout
      - run:
          name: shfmt (shell formatting)
          command: shfmt -i 4 -ci -sr -d src/scripts/*.sh

  # ---------------------------------------------------------------------
  # TEMPORARY measurement jobs for the cache-images caching-default review
  # (see docs/ROADMAP.md's caching-defaults entry once landed). These do
  # NOT use the act orb itself -- they replicate cache-image.yml/
  # restore-image.yml's exact steps (docker save/load, the same cache-key
  # shape) directly, so the timings are apples-to-apples with what the
  # orb's cache-images parameter actually does, without paying for a full
  # orb pack/inject cycle on every measurement iteration. Remove this
  # workflow and these three jobs before merging any default change to
  # main; they exist only to produce the A/B/C numbers on this branch.
  # ---------------------------------------------------------------------
  measure-a-cold-pull:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - run:
          name: "A: cold registry pull (cache-images=false)"
          command: |
            echo "Image present before pull? (expect: none)"
            docker images catthehacker/ubuntu:act-latest
            time docker pull catthehacker/ubuntu:act-latest
  measure-b-cache-miss:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - run:
          name: "B: pull image (cache-images=true, cold/cache-miss path)"
          command: |
            time docker pull catthehacker/ubuntu:act-latest
      - run:
          name: "B: docker save"
          command: |
            time docker save --output /tmp/act-images.tar catthehacker/ubuntu:act-latest
            ls -lh /tmp/act-images.tar
      - save_cache:
          name: "B: cache upload"
          key: measure-{{ .Environment.CIRCLE_WORKFLOW_ID }}-act-cache-images-{{ arch }}-ubuntu-latest=catthehacker/ubuntu:act-latest
          paths:
            - /tmp/act-images.tar
  measure-c-cache-hit:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - restore_cache:
          name: "C: cache restore"
          keys:
            - measure-{{ .Environment.CIRCLE_WORKFLOW_ID }}-act-cache-images-{{ arch }}-ubuntu-latest=catthehacker/ubuntu:act-latest
      - run:
          name: "C: docker load"
          command: |
            ls -lh /tmp/act-images.tar
            time docker load --input /tmp/act-images.tar

workflows:
  lint-pack:
    jobs:
      - check-cli-version:
          filters: *filters
      - orb-tools/lint:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
          requires: [check-cli-version]
      # Ignore RC010
      - orb-tools/review:
          filters: *filters
          exclude: "RC010"
      - shellcheck/check:
          filters: *filters
          severity: error
      - shfmt-check:
          filters: *filters
      # Triggers the next workflow in the Orb Development Kit.
      - orb-tools/continue:
          pipeline_number: << pipeline.number >>
          vcs_type: << pipeline.project.type >>
          orb_name: act
          requires: [orb-tools/lint, orb-tools/pack, orb-tools/review, shellcheck/check, shfmt-check]
          filters: *filters

  # TEMPORARY: measurement-only workflow for the cache-images caching-default
  # review. Independent of lint-pack above -- does not touch orb-tools/pack's
  # requires. Remove before merging any resulting default change to main.
  measure-cache-images:
    jobs:
      - measure-a-cold-pull:
          filters: *filters
      - measure-b-cache-miss:
          filters: *filters
      - measure-c-cache-hit:
          filters: *filters
          requires: [measure-b-cache-miss]
