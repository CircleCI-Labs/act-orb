# Fixture for the `test_gha_render_and_run` job in .circleci/test-deploy.yml.
# Deliberately trivial (no build tooling assumed) so it can actually be
# rendered AND executed end-to-end by a real `act` inside CI, not just
# compiled -- proving the render-job -> act/act runtime path, not only that
# `ghac compile`'s output happens to validate.
name: sample
on: [push]

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo "Hello from a compiled GitHub Actions job"
