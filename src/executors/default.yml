description: Default executor environment for running the Act Orb using machine executors
parameters:
  image:
    type: string
    default: ubuntu-2404:current
    description: Specifies the machine image to use for the executor
  docker_layer_caching:
    type: boolean
    default: false
    description: >
      Enables CircleCI's Docker Layer Caching, which caches `docker build` layer output -- not
      `docker pull`. It does not help the default platform-image pull (see the `cache-images`
      parameter for that instead), but it can genuinely help when a wrapped action is a
      Dockerfile-based container action, since Act builds that image itself. Defaults to false
      since that's not the common case here. See docs/LIMITS.md's "Docker Layer Caching and Act"
      section for the full explanation of when to turn this on.
  resource_class:
    type: string
    default: large
    description: Specifies the resource class for the executor
machine:
  image: << parameters.image >>
  docker_layer_caching: << parameters.docker_layer_caching >>
resource_class: << parameters.resource_class >>
