description: >
  Restore the persisted contents of Act's own built-in GitHub Actions cache-server directory
  (`--cache-server-path`) so a workflow's `actions/cache@v4` calls (and any `setup-*` action with
  built-in caching) can get a real hit against data saved by a *previous job*, not just Act's own
  ephemeral, dies-with-the-container store. See `run-act`'s own `cache-server-*` parameter
  descriptions and docs/CAPABILITIES.md's "Caching" section for the one honest tradeoff this implies: one
  native CircleCI cache key covers the whole directory, so any change that should invalidate a
  single `actions/cache` entry causes every entry under this path to be re-saved together.

parameters:
  cache-server-path:
    type: string
    default: "~/.cache/actcache"
    description: >
      Directory Act's own built-in cache server persists to -- must match the same-named
      parameter passed to `run-act`/`act`/`jobs/act`.
  cache-key-prefix:
    type: string
    default: v1
    description: Prefixes a string to the all cache keys

steps:
  - restore_cache:
      name: Restoring cache for Act's own GitHub Actions cache server...
      keys:
        - << parameters.cache-key-prefix >>-act-cache-server-{{ arch }}-{{ .Environment.CIRCLE_PROJECT_ID }}-{{ .Environment.CIRCLE_JOB }}
        - << parameters.cache-key-prefix >>-act-cache-server-{{ arch }}-
