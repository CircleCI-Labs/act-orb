description: |
  Install ghac, the GitHub Actions workflow -> CircleCI config compiler, via a
  pinned-commit, checksum-verified fetch (the same supply-chain pattern as
  this orb's own `install` command uses for the Act binary itself -- see
  `install-ghac.sh`'s header comment). This is a building block for
  `gha-compile` and `gha-render-job` below; most callers should use those
  directly rather than this command on its own.

parameters:
  bin-dir:
    type: string
    default: "/home/circleci/bin"
    description: The directory where ghac should be installed

steps:
  - run:
      name: "Installing ghac"
      environment:
        ORB_VAL_BIN_DIR: <<parameters.bin-dir>>
      command: <<include(scripts/install-ghac.sh)>>
