description: |
  Re-derive one GitHub Actions job's single-job, `needs:`-stripped,
  `needs.*.outputs.*`-rewritten workflow file, using the `ghac` compiler.
  Run this inside each real job a `gha-compile`-generated config produces,
  immediately before an `act/act` step with `skip-create-workflow-file:
  true` and `workflow-file: <<parameters.out>>` pointed at this command's
  output -- see `src/examples/compile_github_workflow.yml`. Deliberately a
  separate command from `gha-compile`, run per-job rather than shared from
  the setup job: see that command's description and the main README for
  why (a `setup: true` workflow does not share a workspace with the
  pipeline it continues into).

parameters:
  workflow-file:
    type: string
    default: ".github/workflows/ci.yml"
    description: Path (relative to the checked-out repo) to the original GitHub Actions workflow file
  job:
    type: string
    default: ""
    description: The GitHub Actions job id to render (required)
  out:
    type: string
    default: "/tmp/rendered-job.yml"
    description: Path to write the rendered single-job workflow file to
  bin-dir:
    type: string
    default: "/home/circleci/bin"
    description: The directory where ghac should be installed

steps:
  - install-ghac:
      bin-dir: <<parameters.bin-dir>>
  - run:
      name: "ghac render-job: << parameters.job >>"
      environment:
        ORB_VAL_WORKFLOW_FILE: <<parameters.workflow-file>>
        ORB_VAL_JOB: <<parameters.job>>
        ORB_VAL_OUT: <<parameters.out>>
        ORB_VAL_BIN_DIR: <<parameters.bin-dir>>
      command: <<include(scripts/gha-render-job.sh)>>
