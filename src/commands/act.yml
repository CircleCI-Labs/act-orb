description: Handles setting up the needed environment and running Act

parameters:
  checkout:
    type: boolean
    default: true
    description: Checkout the CircleCI repository before running Act
  version:
    type: string
    default: "latest"
    description: The version of Act to install
  debug:
    type: boolean
    default: false
    description: Enable debug logging for installing Act
  bin-dir:
    type: string
    default: "/home/circleci/bin"
    description: The directory where Act should be installed
  force-install:
    type: boolean
    default: false
    description: Force install Act if already present
  cache-cli:
    type: boolean
    default: true
    description: Enables caching of Act CLI using CircleCI caching
  env-file:
    type: string
    default: /tmp/act.env
    description: Path to store or fetch the environment variables file
  secret-file:
    type: string
    default: /tmp/act.secrets
    description: Path to store or fetch the secret variables file
  secrets:
    type: string
    default: GITHUB_TOKEN
    description: A comma-separated list of environment variables treated as secrets
  var-file:
    type: string
    default: /tmp/act.vars
    description: Path to store or fetch variables file
  variables:
    type: string
    default: ""
    description: A comma-separated list of variables treated as ${{ vars.VARIABLE }}
  github-token:
    type: env_var_name
    default: GITHUB_TOKEN
    description: >
      Name of the CircleCI env var (project or context env var) holding the GitHub
      token Act/the wrapped Action should see. Defaults to `GITHUB_TOKEN` -- the exact
      same behavior as today. A seam only, for a future CircleCI-platform-minted,
      scoped, short-lived token to be injected under a different env var name with no
      interface change; see `create-env-var-secret-files`'s own parameter description
      and docs/LIMITS.md's "Security notes" section for the full rationale.
  workflow-file:
    type: string
    default: /tmp/workflow.yml
    description: Path to store or fetch the workflow file to execute
  uses:
    type: string
    default: ""
    description: >
      The GitHub Action to execute (e.g. actions/checkout@v2). Alias for `id` below -- exactly
      one of the two must be set. `uses` wins if both are set.
  id:
    type: string
    default: ""
    description: >
      Family-consistent alias for `uses`: the GitHub Action to execute (e.g.
      actions/checkout@v2). Added for consistency with sibling ecosystem-bridge orbs, which use
      `id`/`inputs` rather than GitHub's own `uses`/`with` vocabulary; `uses`/`with` remain the
      primary names for this orb since they are the vocabulary its actual audience (GitHub
      Actions users) already knows. `uses` wins if both are set.
  with:
    default: ""
    type: string
    description: >
      Key-value pairs for the `with` block. Alias for `inputs` below -- `with` wins if both are set.
  inputs:
    type: string
    default: ""
    description: >
      Family-consistent alias for `with`: key-value pairs passed to the action's inputs. `with`
      wins if both are set.
  env:
    type: string
    default: ""
    description: Key-value pairs for the `env` block
  workflow-name:
    type: string
    default: "circleci"
    description: Name of the workflow
  workflow-event:
    type: string
    default: "push"
    description: Event that triggers the workflow (e.g. push, pull_request)
  job-name:
    type: string
    default: "action"
    description: Name of the job
  runs-on-image:
    type: string
    default: "ubuntu-latest"
    description: Image to run the job on (e.g. ubuntu-latest, windows-latest)
  services:
    type: string
    default: ""
    description: >
      Verbatim YAML for the job's `services:` block, passed straight through to Act with no
      translation (Act emulates it via its own Docker networking ; see docs/LIMITS.md's "What does not work" section for known Act service-emulation issues this inherits). Ignored when
      `skip-create-workflow-file` is set.
  outputs:
    type: string
    default: ""
    description: >
      Comma-separated list of the action's output keys (matching its action.yml `outputs:`) to
      surface into $BASH_ENV, verbatim by name, for later native CircleCI steps in this job to
      read as plain shell variables. Empty (the default) means no outputs are collected -- zero
      behavior change for existing callers. Requires `skip-create-workflow-file` to be unset
      (this orb must be the one generating the workflow file to also generate the output-capture
      step) and `bind` to stay enabled (the default).
  outputs-file:
    type: string
    default: .act-orb-outputs.env
    description: >
      Filename (relative to the checkout root) used to hand the action's outputs from inside
      Act's container back to the CircleCI host. Only used when `outputs` is non-empty.
  platform:
    type: string
    default: ubuntu-latest=catthehacker/ubuntu:act-latest
    description: Custom image to use per platform
  event-file:
    type: string
    default: /tmp/act.event
    description: Path to the event JSON file
  actor:
    type: string
    default: nektos/act
    description: User that triggered the event
  bind:
    type: boolean
    default: true
    description: >
      Enables the bind flag which binds working directory to container, rather than copy. NOTE:
      Act's own CLI default for --bind is false; this orb defaults to true. See docs/ARCHITECTURE.md's "Defaults that deviate from Act" section.
  verbose:
    type: boolean
    default: false
    description: Enables detailed output logs
  detect-event:
    type: boolean
    default: true
    description: >
      Automatically detects and uses the first event type in the workflow. NOTE: Act's own CLI
      default for --detect-event is false; this orb defaults to true. See docs/ARCHITECTURE.md's "Defaults that deviate from Act" section.
  directory:
    type: string
    default: .
    description: Working directory for the workflow
  action-offline-mode:
    type: boolean
    default: true
    description: >
      Enable offline mode for actions (runs without fetching actions from remote sources). NOTE:
      Act's own CLI default for --action-offline-mode is false; this orb defaults to true. See
      docs/ARCHITECTURE.md's "Defaults that deviate from Act" section.
  cache-actions:
    type: boolean
    default: true
    description: Enables caching of GitHub Actions using CircleCI caching
  cache-images:
    type: boolean
    default: false
    description: >
      Enables caching of Docker images used by Act using CircleCI caching. Defaults to false,
      measured rather than assumed: a real cache-hit round trip (restore + `docker load`) was
      18-22% slower than just pulling the default platform image fresh, since a CircleCI cache
      restore is itself a network download and `docker load`'s own cost alone exceeded the
      whole registry pull. See docs/CAPABILITIES.md's "Caching" section for the measured
      numbers and docs/ROADMAP.md's "Caching-defaults standard" item for the family-wide rule
      this default follows.
  defaultbranch:
    type: string
    default: main
    description: Specifies the default branch to use
  job:
    type: string
    default: ""
    description: Specifies a specific job ID to run
  pull:
    type: boolean
    default: false
    description: >
      Forces pulling of Docker images even if already present. NOTE: Act's own CLI default for
      --pull is true; this orb defaults to false. See docs/ARCHITECTURE.md's "Defaults that deviate from Act" section.
  rebuild:
    type: boolean
    default: false
    description: >
      Rebuilds local Docker images even if already present. NOTE: Act's own CLI default for
      --rebuild is true; this orb defaults to false. See docs/ARCHITECTURE.md's "Defaults that
      deviate from Act" section.
  remote-name:
    type: string
    default: origin
    description: Specifies the Git remote name for retrieving the repo URL
  reuse:
    type: boolean
    default: true
    description: >
      Prevents container removal after successful runs for maintaining state. NOTE: Act's own
      CLI default for --reuse is false; this orb defaults to true. See docs/ARCHITECTURE.md's "Defaults that deviate from Act" section.
  input-file:
    type: string
    default: .input
    description: Path to the file containing action inputs
  additional-act-flags:
    type: string
    default: ""
    description: Additional flags to be passed to the `act` CLI
  artifact-server-path:
    type: string
    default: ""
    description: >
      Directory Act's own built-in artifact server stores uploads to/serves downloads from.
      Empty (the default) is a no-op -- see `run-act`'s own parameter description and the
      docs/CAPABILITIES.md's "Artifacts" section for the full explanation.
  artifact-server-addr:
    type: string
    default: ""
    description: Address Act's artifact server binds. Only meaningful when `artifact-server-path` is set.
  artifact-server-port:
    type: string
    default: ""
    description: Port Act's artifact server listens on. Only meaningful when `artifact-server-path` is set.
  cache-server-enabled:
    type: boolean
    default: true
    description: >
      Persist Act's own built-in GitHub Actions cache server storage across jobs via native
      restore_cache/save_cache (true, the default), or disable Act's cache server entirely with
      --no-cache-server (false). See `run-act`'s own parameter description and docs/CAPABILITIES.md's "Caching" section.
  cache-server-path:
    type: string
    default: "~/.cache/actcache"
    description: Directory Act's own built-in cache server persists to. Only meaningful when `cache-server-enabled` is true.
  cache-server-addr:
    type: string
    default: ""
    description: Address Act's own cache server advertises. Empty leaves Act's own auto-detection in place; see docs/CAPABILITIES.md's "Caching" section.
  cache-server-port:
    type: string
    default: ""
    description: Port Act's own cache server listens on. Empty leaves Act's own default in place.
  skip-install:
    type: boolean
    default: false
    description: Skips installing Act
  skip-create-env-var-secret-files:
    type: boolean
    default: false
    description: Skips generating env, var and secret files
  skip-create-workflow-file:
    type: boolean
    default: false
    description: Skips creating the workflow file
  cache-key-prefix:
    type: string
    default: v1
    description: Prefixes a string to the all cache keys
  step-name:
    type: string
    default: Run Act
    description: Allows for customizing the name of run act step

steps:
  - when:
      condition: << parameters.checkout >>
      steps:
        - checkout
  - when:
      condition:
        not: << parameters.skip-install >>
      steps:
        - install:
            version: << parameters.version >>
            debug: << parameters.debug >>
            bin-dir: << parameters.bin-dir >>
            force-install: << parameters.force-install >>
            cache-cli: << parameters.cache-cli >>
            cache-key-prefix: << parameters.cache-key-prefix >>
  - when:
      condition:
        not: << parameters.skip-create-env-var-secret-files >>
      steps:
        - create-env-var-secret-files:
            env-file: << parameters.env-file >>
            secret-file: << parameters.secret-file >>
            secrets: << parameters.secrets >>
            variables: << parameters.variables >>
            var-file: << parameters.var-file >>
            github-token: << parameters.github-token >>
  - when:
      condition:
        not: << parameters.skip-create-workflow-file >>
      steps:
        - create-workflow-file:
            workflow-file: << parameters.workflow-file >>
            action: << parameters.uses >>
            id: << parameters.id >>
            with: << parameters.with >>
            inputs: << parameters.inputs >>
            env: << parameters.env >>
            workflow-name: << parameters.workflow-name >>
            workflow-event: << parameters.workflow-event >>
            job-name: << parameters.job-name >>
            runs-on-image: << parameters.runs-on-image >>
            services: << parameters.services >>
            outputs: << parameters.outputs >>
            outputs-file: << parameters.outputs-file >>
  - run-act:
      workflow-file: << parameters.workflow-file >>
      platform: << parameters.platform >>
      env-file: << parameters.env-file >>
      secret-file: << parameters.secret-file >>
      event-file: << parameters.event-file >>
      var-file: << parameters.var-file >>
      actor: << parameters.actor >>
      bind: << parameters.bind >>
      verbose: << parameters.verbose >>
      detect-event: << parameters.detect-event >>
      directory: << parameters.directory >>
      action-offline-mode: << parameters.action-offline-mode >>
      cache-actions: << parameters.cache-actions >>
      cache-images: << parameters.cache-images >>
      defaultbranch: << parameters.defaultbranch >>
      job: << parameters.job >>
      pull: << parameters.pull >>
      rebuild: << parameters.rebuild >>
      remote-name: << parameters.remote-name >>
      reuse: << parameters.reuse >>
      input-file: << parameters.input-file >>
      additional-act-flags: << parameters.additional-act-flags >>
      artifact-server-path: << parameters.artifact-server-path >>
      artifact-server-addr: << parameters.artifact-server-addr >>
      artifact-server-port: << parameters.artifact-server-port >>
      cache-server-enabled: << parameters.cache-server-enabled >>
      cache-server-path: << parameters.cache-server-path >>
      cache-server-addr: << parameters.cache-server-addr >>
      cache-server-port: << parameters.cache-server-port >>
      cache-key-prefix: << parameters.cache-key-prefix >>
      step-name: << parameters.step-name >>
      outputs: << parameters.outputs >>
      outputs-file: << parameters.outputs-file >>
