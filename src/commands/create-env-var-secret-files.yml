description: Generate environment, variable and secret files for Act

parameters:
  env-file:
    type: string
    default: /tmp/act.env
    description: Path to store environment variables file
  secret-file:
    type: string
    default: /tmp/act.secrets
    description: Path to store secret variables file
  var-file:
    type: string
    default: /tmp/act.vars
    description: Path to store variables file
  secrets:
    type: string
    default: GITHUB_TOKEN
    description: A comma-separated list of environment variables treated as secrets
  variables:
    type: string
    default: ""
    description: A comma-separated list of variables treated as ${{ vars.VARIABLE }}
  github-token:
    type: env_var_name
    default: GITHUB_TOKEN
    description: >
      Name of the CircleCI env var (project or context env var) holding the GitHub
      token Act/the wrapped Action should see. Defaults to `GITHUB_TOKEN`, i.e. the
      exact same behavior as today: a CircleCI env var literally named `GITHUB_TOKEN`
      (already `secrets`'s own default member) is what gets used. Whatever this
      parameter names, its value is aliased into the secrets bucket under the literal
      key `GITHUB_TOKEN`, and that source variable's own name is kept out of the
      plaintext bucket -- so you don't also have to add it to `secrets` yourself. This
      is a seam only: it lets a future CircleCI-platform-minted, scoped, short-lived
      token be injected under a different env var name with no interface change; no
      minting logic is implemented here. See docs/LIMITS.md's "Security notes" section and
      docs/ROADMAP.md for why this seam exists.

steps:
  - run:
      name: Generate Environment, Variable and Secret Files
      environment:
        ORB_VAL_ENV_FILE: <<parameters.env-file>>
        ORB_VAL_SECRET_FILE: <<parameters.secret-file>>
        ORB_VAL_SECRETS: <<parameters.secrets>>
        ORB_VAL_VAR_FILE: <<parameters.var-file>>
        ORB_VAL_VARIABLES: <<parameters.variables>>
        ORB_VAL_GITHUB_TOKEN: <<parameters.github-token>>
      command: <<include(scripts/create-env-var-secret-files.sh)>>
