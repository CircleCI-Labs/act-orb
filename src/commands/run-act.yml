description: Run a workflow YAML file using Act

parameters:
  workflow-file:
    type: string
    default: /tmp/workflow.yml
    description: Path to the workflow file to execute
  platform:
    type: string
    default: ubuntu-latest=catthehacker/ubuntu:act-latest
    description: Custom image to use per platform
  env-file:
    type: string
    default: /tmp/act.env
    description: Path to the environment variables file
  secret-file:
    type: string
    default: /tmp/act.secrets
    description: Path to the secret variables file
  event-file:
    type: string
    default: /tmp/act.event
    description: Path to the event JSON file
  actor:
    type: string
    default: nektos/act
    description: User that triggered the event
  bind:
    type: boolean
    default: true
    description: >
      Enables the bind flag which binds working directory to container, rather than copy. NOTE:
      Act's own CLI default for --bind is false; this orb defaults to true so the checkout
      directory (and this command's own output-capture file, see `outputs`) is shared with the
      container rather than copied. See docs/ARCHITECTURE.md's "Defaults that deviate from Act" section.
  verbose:
    type: boolean
    default: false
    description: Enables detailed output logs
  detect-event:
    type: boolean
    default: true
    description: >
      Automatically detects and uses the first event type in the workflow. NOTE: Act's own CLI
      default for --detect-event is false; this orb defaults to true. See docs/ARCHITECTURE.md's "Defaults that deviate from Act" section.
  directory:
    type: string
    default: .
    description: Working directory for the workflow
  action-offline-mode:
    type: boolean
    default: true
    description: >
      Enable offline mode for actions (runs without fetching actions from remote sources). NOTE:
      Act's own CLI default for --action-offline-mode is false; this orb defaults to true since
      the actions cache (see `cache-actions`) is expected to already hold what was fetched on a
      prior run. See docs/ARCHITECTURE.md's "Defaults that deviate from Act" section.
  outputs:
    type: string
    default: ""
    description: >
      Comma-separated list of the wrapped GitHub Action's output keys (matching its
      action.yml `outputs:`) to surface into $BASH_ENV, verbatim by name, so later native
      CircleCI steps in the same job can read them as plain shell variables. Empty (the
      default) means no outputs are collected -- fully off, zero behavior change for existing
      callers. Requires `outputs-file` to be reachable both inside Act's container and on the
      CircleCI host, which is only true when `bind` is enabled (the default) and the workflow
      file is the one this orb generates (i.e. `skip-create-workflow-file` is not set).
  outputs-file:
    type: string
    default: .act-orb-outputs.env
    description: >
      Filename (relative to `directory`) used to hand the wrapped action's outputs from inside
      Act's container back to the CircleCI host. Only used when `outputs` is non-empty. This is
      a transient file the orb creates and never commits.
  cache-actions:
    type: boolean
    default: true
    description: Enables caching of actions using CircleCI caching
  cache-images:
    type: boolean
    default: false
    description: >
      Enables caching of Docker images used by Act using CircleCI caching. What this is
      genuinely for is reliability, not speed: it replaces a repeated Docker Hub registry pull
      with a CircleCI cache pull, which matters if you're hitting Docker Hub's anonymous-pull
      rate limit or pulling from a slow/unreliable registry. On speed alone it's a net loss for
      the default platform image, measured rather than assumed: a real cache-hit round trip
      (restore + `docker load`) was 18-22% slower than just pulling the default platform image
      fresh, since a CircleCI cache restore is itself a network download and `docker load`'s own
      cost alone exceeded the whole registry pull. Defaults to false accordingly. See
      docs/CAPABILITIES.md's "Caching" section for the measured numbers and the full reliability
      framing, and docs/ROADMAP.md's "Caching-defaults standard" item for the family-wide rule
      this default follows.
  defaultbranch:
    type: string
    default: main
    description: Specifies the default branch to use
  job:
    type: string
    default: ""
    description: Specifies a specific job ID to run
  pull:
    type: boolean
    default: true
    description: >
      Forces pulling of Docker images even if already present. Matches Act's own CLI default
      (`true`) when this command is used standalone. Unlike every other parameter here, this
      one is deliberately left at Act's own default rather than one of this orb's own, because
      `run-act` is itself a published, directly-callable command (see the README's Quick Start:
      "Use the `act/act` command instead of the job if you need to run it inside your own
      executor/job") and flipping its standalone default would silently change behavior for
      any existing caller who never sets `pull`. The `act`/`jobs/act` entry points explicitly
      pass `pull: false` by default instead (tuned for CircleCI's fresh-VM-per-job model, where
      the image was likely just pulled/cached this run); see docs/ARCHITECTURE.md's "Defaults
      that deviate from Act" section. That override is explicit at the `act`/`jobs/act` layer
      and does not change this command's own default.
  rebuild:
    type: boolean
    default: true
    description: >
      Rebuilds local Docker images even if already present. Matches Act's own CLI default
      (`true`) when this command is used standalone, for the same reason as `pull` above. The
      `act`/`jobs/act` entry points explicitly pass `rebuild: false` by default instead -- see
      docs/ARCHITECTURE.md's "Defaults that deviate from Act" section.
  remote-name:
    type: string
    default: origin
    description: Specifies the Git remote name for retrieving the repo URL
  reuse:
    type: boolean
    default: true
    description: Prevents container removal after successful runs for maintaining state
  input-file:
    type: string
    default: .input
    description: Path to the file containing action inputs
  var-file:
    type: string
    default: /tmp/act.vars
    description: Path to the variables file
  additional-act-flags:
    type: string
    default: ""
    description: Additional flags to be passed to the `act` CLI
  artifact-server-path:
    type: string
    default: ""
    description: >
      Directory Act's own built-in artifact server stores uploads to/serves downloads from
      (`--artifact-server-path`). Empty (the default) means this flag is never passed at all --
      identical behavior to before this parameter existed, and `actions/upload-artifact`/
      `download-artifact` get no `ACTIONS_RUNTIME_URL`/`ACTIONS_RESULTS_URL` from Act, the same
      as today. Set it to enable Act's OWN artifact server (Act already implements the real
      GitHub Actions artifact-v4 protocol; see docs/CAPABILITIES.md's "Artifacts" section. This
      parameter only turns on a flag Act already has, no new server is built here) and then use
      a native `store_artifacts`/`persist_to_workspace` step afterwards pointed at this same
      path to actually get the uploaded files out of the ephemeral container. Does not help
      `container:`-scoped jobs, whose `upload-artifact@v4` fails outright for an unrelated
      reason; see docs/LIMITS.md.
  artifact-server-addr:
    type: string
    default: ""
    description: >
      Address Act's artifact server binds (`--artifact-server-addr`). Empty (the default) means
      this flag is never passed, leaving Act's own default (its outbound IP). Only meaningful
      when `artifact-server-path` is set.
  artifact-server-port:
    type: string
    default: ""
    description: >
      Port Act's artifact server listens on (`--artifact-server-port`). Empty (the default)
      means this flag is never passed, leaving Act's own default (`34567`). Only meaningful when
      `artifact-server-path` is set.
  cache-key-prefix:
    type: string
    default: v1
    description: Prefixes a string to the all cache keys
  cache-server-enabled:
    type: boolean
    default: true
    description: >
      Act already ships its own built-in GitHub Actions cache server (`pkg/artifactcache`) and
      starts it automatically unless told not to -- a real, unmodified `actions/cache@v4` inside
      the wrapped action talks to it with no orb-side protocol translation at all. This parameter
      controls whether *this orb* also persists that server's storage directory
      (`cache-server-path`) across jobs via native `restore_cache`/`save_cache` (true, the
      default) or disables Act's server entirely by passing `--no-cache-server` (false). It does
      NOT control whether Act's cache server itself runs when this parameter is true -- that
      always happens by Act's own default; setting `cache-server-path` merely tells Act (and this
      orb) where its storage lives so it can be cached. See docs/CAPABILITIES.md's "Caching" section for the
      one documented tradeoff (one native cache key per job covers the whole directory) and for
      what happens with no cache server reachable at all (`actions/cache` warns and continues,
      verified behavior in `actions/toolkit`, not a failure).
  cache-server-path:
    type: string
    default: "~/.cache/actcache"
    description: >
      Directory Act's own built-in cache server persists to (`--cache-server-path`). Defaults to
      Act's own CLI default, so setting this explicitly changes nothing about Act's behavior --
      it only gives this orb a known, stable path to `restore_cache`/`save_cache` around. Only
      meaningful when `cache-server-enabled` is true.
  cache-server-addr:
    type: string
    default: ""
    description: >
      Address Act's own cache server advertises to the wrapped action (`--cache-server-addr`).
      Empty (the default) leaves Act's own auto-detection of an outbound IP in place, which is
      expected to work on a real CircleCI container but was observed to pick the wrong interface
      (a VPN adapter) on at least one developer machine, requiring this to be set explicitly
      alongside `--network host` there. Only meaningful when `cache-server-enabled` is true --
      see docs/CAPABILITIES.md's "Caching" section for when to set this.
  cache-server-port:
    type: string
    default: ""
    description: >
      Port Act's own cache server listens on (`--cache-server-port`). Empty (the default) leaves
      Act's own default (a randomly assigned free port) in place. Only meaningful when
      `cache-server-enabled` is true.
  step-name:
    type: string
    default: Run Act
    description: Allows for customizing the name of run act step

steps:
  - when:
      condition: << parameters.cache-actions >>
      steps:
        - restore-actions:
            cache-key-prefix: <<parameters.cache-key-prefix>>
  - when:
      condition: << parameters.cache-images >>
      steps:
        - restore-image:
            platform: <<parameters.platform>>
            cache-key-prefix: <<parameters.cache-key-prefix>>
  - when:
      condition: << parameters.cache-server-enabled >>
      steps:
        - restore-actcache:
            cache-server-path: <<parameters.cache-server-path>>
            cache-key-prefix: <<parameters.cache-key-prefix>>
  - run:
      name: << parameters.step-name >>
      environment:
        ORB_VAL_WORKFLOW_FILE: <<parameters.workflow-file>>
        ORB_VAL_PLATFORM: <<parameters.platform>>
        ORB_VAL_ENV_FILE: <<parameters.env-file>>
        ORB_VAL_SECRET_FILE: <<parameters.secret-file>>
        ORB_VAL_EVENT_FILE: <<parameters.event-file>>
        ORB_VAL_ACTOR: <<parameters.actor>>
        ORB_VAL_BIND: <<parameters.bind>>
        ORB_VAL_VERBOSE: <<parameters.verbose>>
        ORB_VAL_DETECT_EVENT: <<parameters.detect-event>>
        ORB_VAL_DIRECTORY: <<parameters.directory>>
        ORB_VAL_ACTION_OFFLINE_MODE: <<parameters.action-offline-mode>>
        ORB_VAL_CACHE_ACTIONS: <<parameters.cache-actions>>
        ORB_VAL_DEFAULT_BRANCH: <<parameters.defaultbranch>>
        ORB_VAL_JOB: <<parameters.job>>
        ORB_VAL_PULL: <<parameters.pull>>
        ORB_VAL_REBUILD: <<parameters.rebuild>>
        ORB_VAL_REMOTE_NAME: <<parameters.remote-name>>
        ORB_VAL_REUSE: <<parameters.reuse>>
        ORB_VAL_INPUT_FILE: <<parameters.input-file>>
        ORB_VAL_VAR_FILE: <<parameters.var-file>>
        ORB_VAL_ADDITIONAL_ACT_FLAGS: <<parameters.additional-act-flags>>
        ORB_VAL_ARTIFACT_SERVER_PATH: <<parameters.artifact-server-path>>
        ORB_VAL_ARTIFACT_SERVER_ADDR: <<parameters.artifact-server-addr>>
        ORB_VAL_ARTIFACT_SERVER_PORT: <<parameters.artifact-server-port>>
        ORB_VAL_CACHE_SERVER_ENABLED: <<parameters.cache-server-enabled>>
        ORB_VAL_CACHE_SERVER_PATH: <<parameters.cache-server-path>>
        ORB_VAL_CACHE_SERVER_ADDR: <<parameters.cache-server-addr>>
        ORB_VAL_CACHE_SERVER_PORT: <<parameters.cache-server-port>>
        ORB_VAL_OUTPUTS: <<parameters.outputs>>
        ORB_VAL_OUTPUTS_FILE: <<parameters.outputs-file>>
      command: <<include(scripts/run-act.sh)>>
  - when:
      condition:
        not:
          equal: ["", << parameters.outputs >>]
      steps:
        - collect-outputs:
            outputs: <<parameters.outputs>>
            outputs-file: <<parameters.outputs-file>>
            directory: <<parameters.directory>>
  - when:
      condition: << parameters.cache-actions >>
      steps:
        - cache-actions:
            cache-key-prefix: <<parameters.cache-key-prefix>>
  - when:
      condition: << parameters.cache-images >>
      steps:
        - cache-image:
            platform: <<parameters.platform>>
            cache-key-prefix: <<parameters.cache-key-prefix>>
  - when:
      condition: << parameters.cache-server-enabled >>
      steps:
        - cache-actcache:
            cache-server-path: <<parameters.cache-server-path>>
            cache-key-prefix: <<parameters.cache-key-prefix>>
