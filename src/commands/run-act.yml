description: Run a workflow YAML file using Act

parameters:
  workflow-file:
    type: string
    default: /tmp/workflow.yml
    description: Path to the workflow file to execute
  platform:
    type: string
    default: ubuntu-latest=catthehacker/ubuntu:act-latest
    description: Custom image to use per platform
  env-file:
    type: string
    default: /tmp/act.env
    description: Path to the environment variables file
  secret-file:
    type: string
    default: /tmp/act.secrets
    description: Path to the secret variables file
  event-file:
    type: string
    default: /tmp/act.event
    description: Path to the event JSON file
  actor:
    type: string
    default: nektos/act
    description: User that triggered the event
  bind:
    type: boolean
    default: true
    description: >
      Enables the bind flag which binds working directory to container, rather than copy. NOTE:
      Act's own CLI default for --bind is false; this orb defaults to true so the checkout
      directory (and this command's own output-capture file, see `outputs`) is shared with the
      container rather than copied. See the README's "Defaults that deviate from Act" section.
  verbose:
    type: boolean
    default: false
    description: Enables detailed output logs
  detect-event:
    type: boolean
    default: true
    description: >
      Automatically detects and uses the first event type in the workflow. NOTE: Act's own CLI
      default for --detect-event is false; this orb defaults to true. See the README's "Defaults
      that deviate from Act" section.
  directory:
    type: string
    default: .
    description: Working directory for the workflow
  action-offline-mode:
    type: boolean
    default: true
    description: >
      Enable offline mode for actions (runs without fetching actions from remote sources). NOTE:
      Act's own CLI default for --action-offline-mode is false; this orb defaults to true since
      the actions cache (see `cache-actions`) is expected to already hold what was fetched on a
      prior run. See the README's "Defaults that deviate from Act" section.
  outputs:
    type: string
    default: ""
    description: >
      Comma-separated list of the wrapped GitHub Action's output keys (matching its
      action.yml `outputs:`) to surface into $BASH_ENV, verbatim by name, so later native
      CircleCI steps in the same job can read them as plain shell variables. Empty (the
      default) means no outputs are collected -- fully off, zero behavior change for existing
      callers. Requires `outputs-file` to be reachable both inside Act's container and on the
      CircleCI host, which is only true when `bind` is enabled (the default) and the workflow
      file is the one this orb generates (i.e. `skip-create-workflow-file` is not set).
  outputs-file:
    type: string
    default: .act-orb-outputs.env
    description: >
      Filename (relative to `directory`) used to hand the wrapped action's outputs from inside
      Act's container back to the CircleCI host. Only used when `outputs` is non-empty. This is
      a transient file the orb creates and never commits.
  cache-actions:
    type: boolean
    default: true
    description: Enables caching of actions using CircleCI caching
  cache-images:
    type: boolean
    default: false
    description: Enables caching of Docker images used by Act using CircleCI caching
  defaultbranch:
    type: string
    default: main
    description: Specifies the default branch to use
  job:
    type: string
    default: ""
    description: Specifies a specific job ID to run
  pull:
    type: boolean
    default: false
    description: >
      Forces pulling of Docker images even if already present. NOTE: Act's own CLI default for
      --pull is true; this orb defaults to false (a deliberate deviation, chosen for CircleCI's
      fresh-VM-per-job model where the image was likely just pulled/cached this run) to avoid
      pulling on every single job. See the README's "Defaults that deviate from Act" section.
  rebuild:
    type: boolean
    default: false
    description: >
      Rebuilds local Docker images even if already present. NOTE: Act's own CLI default for
      --rebuild is true; this orb defaults to false for the same reason as `pull` above. See the
      README's "Defaults that deviate from Act" section.
  remote-name:
    type: string
    default: origin
    description: Specifies the Git remote name for retrieving the repo URL
  reuse:
    type: boolean
    default: true
    description: Prevents container removal after successful runs for maintaining state
  input-file:
    type: string
    default: .input
    description: Path to the file containing action inputs
  var-file:
    type: string
    default: /tmp/act.vars
    description: Path to the variables file
  additional-act-flags:
    type: string
    default: ""
    description: Additional flags to be passed to the `act` CLI
  cache-key-prefix:
    type: string
    default: v1
    description: Prefixes a string to the all cache keys
  step-name:
    type: string
    default: Run Act
    description: Allows for customizing the name of run act step

steps:
  - when:
      condition: << parameters.cache-actions >>
      steps:
        - restore-actions:
            cache-key-prefix: <<parameters.cache-key-prefix>>
  - when:
      condition: << parameters.cache-images >>
      steps:
        - restore-image:
            platform: <<parameters.platform>>
            cache-key-prefix: <<parameters.cache-key-prefix>>
  - run:
      name: << parameters.step-name >>
      environment:
        ORB_VAL_WORKFLOW_FILE: <<parameters.workflow-file>>
        ORB_VAL_PLATFORM: <<parameters.platform>>
        ORB_VAL_ENV_FILE: <<parameters.env-file>>
        ORB_VAL_SECRET_FILE: <<parameters.secret-file>>
        ORB_VAL_EVENT_FILE: <<parameters.event-file>>
        ORB_VAL_ACTOR: <<parameters.actor>>
        ORB_VAL_BIND: <<parameters.bind>>
        ORB_VAL_VERBOSE: <<parameters.verbose>>
        ORB_VAL_DETECT_EVENT: <<parameters.detect-event>>
        ORB_VAL_DIRECTORY: <<parameters.directory>>
        ORB_VAL_ACTION_OFFLINE_MODE: <<parameters.action-offline-mode>>
        ORB_VAL_CACHE_ACTIONS: <<parameters.cache-actions>>
        ORB_VAL_DEFAULT_BRANCH: <<parameters.defaultbranch>>
        ORB_VAL_JOB: <<parameters.job>>
        ORB_VAL_PULL: <<parameters.pull>>
        ORB_VAL_REBUILD: <<parameters.rebuild>>
        ORB_VAL_REMOTE_NAME: <<parameters.remote-name>>
        ORB_VAL_REUSE: <<parameters.reuse>>
        ORB_VAL_INPUT_FILE: <<parameters.input-file>>
        ORB_VAL_VAR_FILE: <<parameters.var-file>>
        ORB_VAL_ADDITIONAL_ACT_FLAGS: <<parameters.additional-act-flags>>
      command: <<include(scripts/run-act.sh)>>
  - when:
      condition:
        not:
          equal: ["", << parameters.outputs >>]
      steps:
        - collect-outputs:
            outputs: <<parameters.outputs>>
            outputs-file: <<parameters.outputs-file>>
            directory: <<parameters.directory>>
  - when:
      condition: << parameters.cache-actions >>
      steps:
        - cache-actions:
            cache-key-prefix: <<parameters.cache-key-prefix>>
  - when:
      condition: << parameters.cache-images >>
      steps:
        - cache-image:
            platform: <<parameters.platform>>
            cache-key-prefix: <<parameters.cache-key-prefix>>
