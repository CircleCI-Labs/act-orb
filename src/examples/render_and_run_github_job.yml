description: |
  The per-job pattern used by every job a `gha-compile`-generated config
  produces (see compile_github_workflow.yml for the setup half): re-derive
  this one GitHub Actions job's `needs:`-stripped workflow file with
  `act/gha-render-job`, then hand it to `act/act` via its existing
  `skip-create-workflow-file` + `workflow-file` + `job` escape hatch (not new
  behavior -- `act/act` already had this before the compiler existed). A
  hand-authored job following this exact shape works standalone too, without
  ever running `act/gha-compile`.

usage:
  version: 2.1
  orbs:
    act: circleci/act@x.y.z
  jobs:
    run-github-job:
      docker:
        - image: cimg/base:current
      steps:
        - checkout
        - setup_remote_docker
        - act/gha-render-job:
            workflow-file: .github/workflows/ci.yml
            job: build
            out: /tmp/rendered-job.yml
        - act/act:
            skip-create-workflow-file: true
            workflow-file: /tmp/rendered-job.yml
            job: build
  workflows:
    main:
      jobs:
        - run-github-job
