description: |
  Run one borrowed GitHub Action as a single step, sandwiched between ordinary native
  CircleCI steps in an otherwise fully native job. This is the common case this orb (and its
  ecosystem-bridge siblings) is scoped for; see docs/ARCHITECTURE.md's "Scope" section. `checkout:
  false` on the `act/act` command keeps this job's own earlier `checkout` as the single
  source of truth rather than checking out a second time; the borrowed action neither knows
  nor cares that the build step before it and the deploy step after it are plain shell, not
  GitHub Actions.

usage:
  version: 2.1
  orbs:
    act: circleci/act@x.y.z
  jobs:
    build_scan_deploy:
      docker:
        - image: cimg/base:current
      steps:
        - checkout
        - setup_remote_docker
        - run:
            name: Build (native step, no orb involved)
            command: echo "docker build -t my-app:$CIRCLE_SHA1 ."
        - act/act:
            checkout: false
            step-name: "Scan for vulnerabilities (borrowed GitHub Action)"
            uses: aquasecurity/trivy-action@master
            with: |
              scan-type: fs
              format: table
              exit-code: "1"
            platform: ubuntu-latest=ghcr.io/catthehacker/ubuntu:act-latest
        - run:
            name: Deploy (native step, no orb involved)
            command: echo "deploying my-app:$CIRCLE_SHA1"
  workflows:
    main:
      jobs:
        - build_scan_deploy
