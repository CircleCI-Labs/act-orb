description: |
  Compile a `.github/workflows/*.yml` file that uses `strategy.matrix` into a real CircleCI
  `matrix:` job invocation -- a real CircleCI matrix (the generated job is parameterized and
  invoked once via `matrix:`), not four static jobs unrolled at compile time. Extends
  compile_github_workflow.yml's base setup pattern; see the README's "GitHub Actions workflow
  compiler" section for the exact `strategy.matrix`/`matrix.exclude`/`matrix.include` support
  boundary and for `strategy.matrix` + `runs-on: self-hosted` used together.

usage:
  version: 2.1
  setup: true
  orbs:
    act: circleci/act@x.y.z
    continuation: circleci/continuation@1.0.0
  # Source .github/workflows/matrix-ci.yml being compiled here (excerpt) --
  # this is what makes the generated config below get a matrix: at all:
  #
  #   jobs:
  #     test:
  #       runs-on: ubuntu-latest
  #       strategy:
  #         matrix:
  #           os: [ubuntu-latest, ubuntu-22.04]
  #           node-version: ["18", "20"]
  #       steps:
  #         - uses: actions/checkout@v4
  #         - uses: actions/setup-node@v4
  #           with:
  #             node-version: ${{ matrix.node-version }}
  #         - run: echo "Testing on ${{ matrix.os }} with Node ${{ matrix.node-version }}"
  jobs:
    compile-matrix-workflow:
      docker:
        - image: cimg/base:current
      steps:
        - checkout
        - act/gha-compile:
            workflow-file: .github/workflows/matrix-ci.yml
            out: /tmp/generated-config.yml
        - continuation/continue:
            configuration_path: /tmp/generated-config.yml
  workflows:
    setup:
      jobs:
        - compile-matrix-workflow
