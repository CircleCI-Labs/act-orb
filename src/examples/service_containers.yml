description: |
  Pass a GitHub Actions `services:` block straight through to Act. Act emulates services itself
  via its own Docker networking, which inherits Act's own known service-emulation issues
  (nektos/act#1022, nektos/act#2607) -- this is a verbatim passthrough, not a translation to a
  native CircleCI secondary Docker image. See this orb's README ("What does not work") and
  docs/ROADMAP.md for why a native translation is a bigger, deferred design change.

usage:
  version: 2.1
  orbs:
    act: circleci/act@x.y.z
  workflows:
    main:
      jobs:
        - act/act:
            uses: actions/hello-world-javascript-action@v1.1
            with: |
              who-to-greet: "Mona the Octocat"
            services: |
              postgres:
                image: postgres:16
                env:
                  POSTGRES_PASSWORD: postgres
                ports:
                  - 5432:5432
