# Simple cross-product matrix: 2 os values x 2 node-version values = 4
# CircleCI jobs, generated via a real CircleCI `matrix:` stanza (not four
# hand-copied job entries) -- see internal/compile/matrix.go and
# render.go's renderWorkflowJobEntry.
name: matrix-2x2
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
        node-version: ["18", "20"]
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: echo "Testing on ${{ matrix.os }} with Node ${{ matrix.node-version }}"
