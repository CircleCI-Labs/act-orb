# Matrix + include: the base 2x2 cross product (os x node-version) compiles
# to a real CircleCI matrix; the include entry adds ONE extra, fully-
# specified combination not in that cross product (node-version 21 on
# ubuntu-24.04), which becomes a separate, explicit, non-matrix job
# invocation calling the same parameterized `build` job (see matrix.go's
# expandInclude / render.go's includeJobName). `publish`'s `needs: build`
# must end up requiring BOTH the matrix's own alias ("build") AND that
# extra invocation's name -- see (*Job).requirableNames in compile.go.
name: matrix-include
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
        node-version: ["18", "20"]
        include:
          - os: ubuntu-24.04
            node-version: "21"
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: echo "Building ${{ matrix.os }} node ${{ matrix.node-version }}"

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        run: echo "All build matrix cells finished"
