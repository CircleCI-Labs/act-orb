# Matrix + exclude, end to end: a 2x2 cross product (os x node-version) with
# ONE fully-specified combination excluded. Unlike 08-matrix-2x2.yml (no
# exclude:) or a single-key matrix, this exercises the RENDER side of
# strategy.matrix.exclude (render.go's renderWorkflowJobEntry), not just the
# data-expansion side compile_test.go's TestExpandExcludePartial already
# covers. The exclude entry deliberately specifies BOTH matrix keys, so the
# excluded combo's second key becomes a genuine sibling key inside the same
# YAML mapping (the item right after the "- ") -- exactly the shape that
# exposed a real indentation bug (see render.go's exclude-rendering comment
# and this fixture's own use in TestMatrixExclude / TestFixtures): a
# single-key matrix's exclude entries have no second key at all, so they
# rendered "correctly" by accident and never exercised the bug.
name: matrix-exclude
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
        node-version: ["18", "20"]
        exclude:
          - os: ubuntu-22.04
            node-version: "18"
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: echo "Testing on ${{ matrix.os }} with Node ${{ matrix.node-version }}"
