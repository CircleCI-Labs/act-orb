name: outputs-flow
on: [push]

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      sha_short: ${{ steps.compute.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute version
        id: compute
        run: |
          echo "version=1.2.3" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        run: |
          echo "Publishing version ${{ needs.version.outputs.version }} (${{ needs.version.outputs.sha_short }})"
          ./publish.sh --version "${{ needs.version.outputs.version }}"
