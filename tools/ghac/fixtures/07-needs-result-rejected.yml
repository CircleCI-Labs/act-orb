name: needs-result-rejected
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.b.outputs.built }}
    steps:
      - uses: actions/checkout@v4
      - id: b
        run: echo "built=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy only if build succeeded
        run: |
          if [ "${{ needs.build.result }}" = "success" ]; then
            ./deploy.sh
          fi
